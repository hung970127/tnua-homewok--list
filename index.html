  <style>

    body {
      margin: 0;
      background: #f7f7f5;

    }

    .container {

    .filters {

    .date-section {

    .date {

      font-weight: 600;

    .info {

      align-items: center;

      font-size: 13px;
      color: #777;
    }

    .status {
      font-weight: 600;

      color: #b76e00;
    }

    .late {

    }

      .container {
        width: calc(100% - 28px);
        padding-top: 40px;
      }

      }
    }
 .welcome {

}

.welcome h2 {

}

}

#installButton {

  color: #222;

  font-weight: 600;

}

#installButton:hover {

}

#syncStatus {

  display: flex;

#updateButton {

  color: white;

  font-weight: 600;

    #dateFilterPanel {
  margin-top: 16px;
  width: 100%;
  max-width: none;
  padding: 20px;

  background: white;
  border: 1px solid #e8e8e5;

/* 月份＋左右箭頭 */
.calendar-header {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

#calendarMonth {
  font-size: 15px;
  font-weight: 600;
  color: #222;
}

.calendar-arrow {
  width: 34px;
  height: 34px;

  border: none;
  border-radius: 9px;
  background: transparent;

  font-size: 23px;
  line-height: 1;
  color: #555;

  cursor: pointer;
}

.calendar-arrow:hover {
  background: #f1f1ef;
}

/* 星期 */
.calendar-weekdays {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(7, 1fr);

  font-size: 12px;
  color: #aaa;
  text-align: center;
}

.calendar-weekdays span {
  padding: 5px 0;
}

/* 日期區域 */
#calendarDays {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}

.calendar-day {
  width: 36px;
  height: 36px;
  justify-self: center;

  display: flex;
  align-items: center;
  justify-content: center;

  border: none;
border-radius: 8px;

background: transparent;
  color: #444;

  font-family: inherit;
  font-size: 13px;

  cursor: pointer;
}

.calendar-day:hover {
  background: #f1f1ef;
}

/* 今天 */
.calendar-day.today {
  background: #eeeeeb;
  font-weight: 600;
}

/* 使用者選中的日期 */
.calendar-day.selected {
  background: #222;
  color: white;
  font-weight: 600;
}

/* 有作業的日期 */
.calendar-day.has-homework {
  position: relative;
}

.calendar-day.has-homework::after {
  content: "";
  position: absolute;

  width: 4px;
  height: 4px;

  bottom: 4px;
  left: 50%;
  transform: translateX(-50%);

  border-radius: 50%;
  background: #888;
}

/* 被選中的日期，小圓點改成白色 */
.calendar-day.selected.has-homework::after {
  background: white;
}
    
/* 查看整月 */
#clearDateButton {

  padding: 8px 12px;

  border: none;
  border-radius: 8px;

  background: transparent;
  color: #777;

  font-family: inherit;
  font-size: 12px;

}

#clearDateButton:hover {

  color: #222;
}
    
    #installPanel {
  margin-top: 16px;
  padding: 20px;
  background: #f7f7f5;
  border: 1px solid #e8e8e5;
  border-radius: 12px;

}

#installPanel p {
  margin: 0 0 16px;
  font-size: 14px;
  line-height: 1.6;
  color: #666;
}

.bookmarklet {
  display: inline-block;
  padding: 11px 18px;
  background: #ffffff;
  border: 1px solid #ddddda;
  border-radius: 9px;
  color: #222;
  font-size: 14px;
  font-weight: 600;
  text-decoration: none;
  cursor: grab;
  user-select: none;
}

.bookmarklet:hover {
  background: #f1f1ef;
}

#installPanel .install-hint {
  margin: 14px 0 0;
  font-size: 12px;
  color: #999;
}
    
    #connectButton {
  margin-top: 18px;
  padding: 12px 22px;
  border: none;
  border-radius: 10px;
  background: #111;
  color: white;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

#connectButton:hover {

}

.header-top {

  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.first-use-button {

  border: 1px solid #e4e4e1;
  border-radius: 9px;
  background: white;
  color: #333;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

.first-use-button:hover {

}
    
  </style>
</head>


<body>

  <main class="container">

   <header>

  <div class="header-top">

    <h1>TNUA Homework List</h1>

    <button
      id="firstUseButton"
      class="first-use-button"
    >
      第一次使用
    </button>

  </div>

  <div class="subtitle">
    <p>把新藝學園的作業，整理在這裡。</p>
  </div>

<div id="syncStatus" style="display: none;">
  <span id="lastSyncText">上次同步：--</span>

  <button id="updateButton">
    更新作業
  </button>
</div>
      
<div class="home-summary">

  <div class="summary-title">
    即將到期
  </div>

  <div id="upcoming-homework"></div>

</div>

  </main>

<script>
let allHomeworks = [];
let currentFilter = 'todo';

let selectedDate = null;
let calendarDate = new Date();

function parseDate(text, year = new Date().getFullYear()) {
  if (!text) return null;

  const [md, time] = text.split(' ');
  if (!md || !time) return null;

  const [month, day] = md.split('-').map(Number);
  const [hour, minute] = time.split(':').map(Number);

  return new Date(year, month - 1, day, hour, minute);
}

function getStatus(hw) {
  const now = new Date();
  const open = parseDate(hw.open, hw.year);
  const deadline = parseDate(hw.deadline, hw.year);

  if (hw.submitted) return 'done';
  if (open && now < open) return 'future';
  if (deadline && now > deadline) return 'late';

  return 'todo';
}

function formatDate(date) {
  const month = date.getMonth() + 1;
  const day = date.getDate();

  const today = new Date();
  const tomorrow = new Date();
  tomorrow.setDate(today.getDate() + 1);

  let label = '';

  if (
    date.getFullYear() === today.getFullYear() &&
    date.getMonth() === today.getMonth() &&
    date.getDate() === today.getDate()
  ) {
    label = ' · 今天';
  }

  else if (
    date.getFullYear() === tomorrow.getFullYear() &&
    date.getMonth() === tomorrow.getMonth() &&
    date.getDate() === tomorrow.getDate()
  ) {
    label = ' · 明天';
  }

  return `${month} 月 ${day} 日${label}`;
}

function statusInfo(status) {
  const map = {
    todo: ['待完成', 'todo'],
    late: ['已逾期', 'late'],
    done: ['已完成', 'done'],
    future: ['尚未開放', '']
  };

  return map[status];
}

function loadHomeworks(homeworks) {
  allHomeworks = homeworks.map(hw => ({
    ...hw,
    status: getStatus(hw)
  }));

  renderHomeSummary();
}

/// 讀取這台電腦之前同步的作業資料
const saved = localStorage.getItem('tnuaHomeworks');

if (saved) {
  try {
    loadHomeworks(JSON.parse(saved));
  } catch (error) {
    console.error('本機資料讀取失敗：', error);
  }

} else {
  allHomeworks = [];
  renderHomeSummary();
}

// ================================
// 接收從新藝學園返回的同步資料
// ================================

function readSyncDataFromURL() {

  console.log('=== TNUA SYNC DEBUG START ===');

  const hash = window.location.hash;

  console.log('目前網址：', window.location.href);
  console.log('目前 Hash：', hash);

  if (!hash || !hash.startsWith('#sync=')) {

    console.log('❌ 沒有找到 #sync= 資料');

    return;
  }

  try {

    const encoded = decodeURIComponent(
      hash.substring(6)
    );

    console.log(
      '✓ 找到同步資料，Base64 長度：',
      encoded.length
    );

    const binary = atob(encoded);

    let percentEncoded = '';

    for (let i = 0; i < binary.length; i++) {

      percentEncoded +=
        '%' +
        binary.charCodeAt(i)
          .toString(16)
          .padStart(2, '0');

    }

    const json =
      decodeURIComponent(percentEncoded);

    console.log('✓ Base64 解碼成功');

    const data = JSON.parse(json);

    console.log('✓ JSON 解析成功：', data);

    if (
      data.type !== 'TNUA_HOMEWORK_SYNC'
    ) {

      console.error(
        '❌ type 錯誤：',
        data.type
      );

      return;
    }

    if (!Array.isArray(data.homeworks)) {

      console.error(
        '❌ homeworks 不是陣列'
      );

      return;
    }

    const homeworks = data.homeworks;

    console.log(
      `✓ 收到 ${homeworks.length} 個作業`
    );

    /*
     * 儲存作業
     */

    localStorage.setItem(
      'tnuaHomeworks',
      JSON.stringify(homeworks)
    );

    console.log('✓ 作業已儲存');

    /*
     * 使用同步工具傳回的時間
     */

    const syncTime =
      data.time
        ? new Date(data.time)
        : new Date();

    localStorage.setItem(
      'tnuaLastSync',
      syncTime.toISOString()
    );

    console.log(
      '✓ 同步時間已儲存：',
      syncTime.toString()
    );

    /*
     * 更新作業列表
     */

    loadHomeworks(homeworks);

    /*
     * 更新同步狀態
     */

    const syncStatus =
      document.getElementById('syncStatus');

    const lastSyncText =
      document.getElementById('lastSyncText');

    if (syncStatus && lastSyncText) {

      syncStatus.style.display = 'flex';

      lastSyncText.textContent =
        `上次同步：${syncTime.toLocaleString(
          'zh-TW',
          {
            month: 'numeric',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          }
        )}`;

      console.log(
        '✓ 畫面上的同步時間已更新'
      );

    } else {

      console.error(
        '❌ 找不到 syncStatus 或 lastSyncText'
      );

    }

    /*
     * 清除網址中的同步資料
     */

    history.replaceState(
      null,
      '',
      window.location.pathname
    );

    console.log(
      '✓ 同步完成，已清除 #sync='
    );

    console.log('=== TNUA SYNC DEBUG END ===');

  } catch (error) {

    console.error(
      '❌ 同步資料處理失敗：',
      error
    );

    alert(
      '同步資料讀取失敗，請打開瀏覽器 Console 查看錯誤。'
    );

  }

}


/*
 * 頁面載入後檢查同步資料
 */

if (document.readyState === 'loading') {

  document.addEventListener(
    'DOMContentLoaded',
    readSyncDataFromURL
  );

} else {

  readSyncDataFromURL();

}
</script>

<script>

      month: 'numeric',

      minute: '2-digit'
    })}`;
}

});

  );

};
</script>
