<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TNUA Homework List</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f7f5;
      color: #1f1f1f;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        "Noto Sans TC",
        sans-serif;
    }

    .container {
      width: min(820px, calc(100% - 40px));
      margin: 0 auto;
      padding: 70px 0 100px;
    }

    header {
      margin-bottom: 45px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      letter-spacing: -1px;
      font-weight: 700;
    }

    .subtitle {
      color: #8a8a8a;
      margin-top: 9px;
      font-size: 15px;
    }

    .filters {
      display: flex;
      gap: 8px;
      margin-top: 28px;
      flex-wrap: wrap;
    }

    .filter {
      border: 1px solid #e4e4e1;
      background: white;
      padding: 8px 14px;
      border-radius: 100px;
      font-size: 14px;
      cursor: pointer;
    }

    .filter.active {
      background: #1f1f1f;
      color: white;
      border-color: #1f1f1f;
    }

    .date-section {
      margin-top: 40px;
    }

    .date {
      font-size: 14px;
      font-weight: 600;
      color: #777;
      margin-bottom: 12px;
    }

    .homework {
      display: block;
      background: white;
      border: 1px solid #e8e8e5;
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 10px;

      text-decoration: none;
      color: inherit;

      transition:
        transform .15s ease,
        box-shadow .15s ease;
    }

    .homework:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,.06);
    }

    .course {
      color: #8a8a8a;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .homework-title {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.5;
    }

    .info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      font-size: 13px;
      color: #777;
    }

    .status {
      font-weight: 600;
    }

    .todo {
      color: #b76e00;
    }

    .late {
      color: #d13c3c;
    }

    .done {
      color: #378557;
    }

    @media (max-width: 600px) {
      .container {
        width: calc(100% - 28px);
        padding-top: 40px;
      }

      h1 {
        font-size: 29px;
      }
    }
 .welcome {
  margin-top: 48px;
  padding: 36px;
  background: white;
  border: 1px solid #e5e5e5;
  border-radius: 18px;
  text-align: center;
}

.welcome h2 {
  margin: 0 0 10px;

}

.welcome > p {
  color: #666;
}

#installButton {
  margin-top: 18px;
  padding: 12px 22px;
  border: 1px solid #ddd;
  border-radius: 10px;
  background: white;
  color: #222;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

#installButton:hover {
  background: #f5f5f5;
}

#syncStatus {
  margin: 20px 0;

  border: 1px solid #e8e8e5;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

#lastSyncText {
  font-size: 13px;
  color: #888;
}

#updateButton {
  padding: 9px 14px;
  border: none;
  border-radius: 8px;
  background: #222;
  color: white;
  font-size: 13px;
  font-weight: 600;

}

#updateButton:hover {

}

    #dateFilterPanel {
  margin-top: 16px;
  width: 100%;
  max-width: none;
  padding: 20px;

  background: white;
  border: 1px solid #e8e8e5;
  border-radius: 16px;

  flex-direction: column;
  gap: 16px;

  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
}

/* 月份＋左右箭頭 */
.calendar-header {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

#calendarMonth {
  font-size: 15px;
  font-weight: 600;
  color: #222;
}

.calendar-arrow {
  width: 34px;
  height: 34px;

  border: none;
  border-radius: 9px;
  background: transparent;

  font-size: 23px;
  line-height: 1;
  color: #555;

  cursor: pointer;
}

.calendar-arrow:hover {
  background: #f1f1ef;
}

/* 星期 */
.calendar-weekdays {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(7, 1fr);

  font-size: 12px;
  color: #aaa;
  text-align: center;
}

.calendar-weekdays span {
  padding: 5px 0;
}

/* 日期區域 */
#calendarDays {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}

.calendar-day {
  height: 42px;

  display: flex;
  align-items: center;
  justify-content: center;

  border: none;
  border-radius: 50%;

  background: transparent;
  color: #444;

  font-family: inherit;
  font-size: 13px;

  cursor: pointer;
}

.calendar-day:hover {
  background: #f1f1ef;
}

/* 今天 */
.calendar-day.today {
  background: #eeeeeb;
  font-weight: 600;
}

/* 使用者選中的日期 */
.calendar-day.selected {
  background: #222;
  color: white;
  font-weight: 600;
}

/* 有作業的日期 */
.calendar-day.has-homework {
  position: relative;
}

.calendar-day.has-homework::after {
  content: "";
  position: absolute;

  width: 4px;
  height: 4px;

  bottom: 4px;
  left: 50%;
  transform: translateX(-50%);

  border-radius: 50%;
  background: #888;
}

/* 被選中的日期，小圓點改成白色 */
.calendar-day.selected.has-homework::after {
  background: white;
}
    
/* 查看整月 */
#clearDateButton {
  align-self: flex-end;

  padding: 8px 12px;

  border: none;
  border-radius: 8px;

  background: transparent;
  color: #777;

  font-family: inherit;
  font-size: 12px;

  cursor: pointer;
}

#clearDateButton:hover {
  background: #f1f1ef;
  color: #222;
}
    
    #installPanel {
  margin-top: 16px;
  padding: 20px;
  background: #f7f7f5;
  border: 1px solid #e8e8e5;
  border-radius: 12px;
  text-align: center;
}

#installPanel p {
  margin: 0 0 16px;
  font-size: 14px;
  line-height: 1.6;
  color: #666;
}

.bookmarklet {
  display: inline-block;
  padding: 11px 18px;
  background: #ffffff;
  border: 1px solid #ddddda;
  border-radius: 9px;
  color: #222;
  font-size: 14px;
  font-weight: 600;
  text-decoration: none;
  cursor: grab;
  user-select: none;
}

.bookmarklet:hover {
  background: #f1f1ef;
}

#installPanel .install-hint {
  margin: 14px 0 0;
  font-size: 12px;
  color: #999;
}
    
    #connectButton {
  margin-top: 18px;
  padding: 12px 22px;
  border: none;
  border-radius: 10px;
  background: #111;
  color: white;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

#connectButton:hover {
  opacity: 0.8;
}

.setup-steps {
  margin: 28px 0 8px;
  text-align: left;
}

.setup-step {
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding: 16px 0;
  border-bottom: 1px solid #eeeeeb;
}

.setup-step:last-child {
  border-bottom: none;
}

.setup-step strong {
  font-size: 15px;
  font-weight: 600;
  color: #222;
}

.setup-step span {
  padding-left: 24px;

    .welcome .privacy {

     <div class="filters">

<script>
let allHomeworks = [];
let currentFilter = 'todo';

let selectedDate = null;
let calendarDate = new Date();

function parseDate(text, year = new Date().getFullYear()) {
  if (!text) return null;

  const [md, time] = text.split(' ');
  if (!md || !time) return null;

  const [month, day] = md.split('-').map(Number);
  const [hour, minute] = time.split(':').map(Number);

  return new Date(year, month - 1, day, hour, minute);
}

function getStatus(hw) {
  const now = new Date();
  const open = parseDate(hw.open, hw.year);
  const deadline = parseDate(hw.deadline, hw.year);

  if (hw.submitted) return 'done';
  if (open && now < open) return 'future';
  if (deadline && now > deadline) return 'late';

  return 'todo';
}

function formatDate(date) {
  const month = date.getMonth() + 1;
  const day = date.getDate();

  const today = new Date();
  const tomorrow = new Date();
  tomorrow.setDate(today.getDate() + 1);

  let label = '';

  if (
    date.getFullYear() === today.getFullYear() &&
    date.getMonth() === today.getMonth() &&
    date.getDate() === today.getDate()
  ) {
    label = ' · 今天';
  }

  else if (
    date.getFullYear() === tomorrow.getFullYear() &&
    date.getMonth() === tomorrow.getMonth() &&
    date.getDate() === tomorrow.getDate()
  ) {
    label = ' · 明天';
  }

  return `${month} 月 ${day} 日${label}`;
}

function statusInfo(status) {
  const map = {
    todo: ['待完成', 'todo'],
    late: ['已逾期', 'late'],
    done: ['已完成', 'done'],
    future: ['尚未開放', '']
  };

  return map[status];
}

function render(filter = 'todo') {
  currentFilter = filter;

  const list = document.getElementById('homework-list');
  list.innerHTML = '';

  let homeworks =
  filter === 'all'
    ? [...allHomeworks]
    : allHomeworks.filter(hw => hw.status === filter);

// 「全部」預設顯示本月作業
// 「全部」的日期篩選
if (filter === 'all') {

  if (selectedDate) {
    const year = selectedDate.getFullYear();
    const month = selectedDate.getMonth();
    const day = selectedDate.getDate();

    homeworks = homeworks.filter(hw => {
      const deadline = parseDate(hw.deadline, hw.year);

      if (!deadline) return false;

      return (
        deadline.getFullYear() === year &&
        deadline.getMonth() === month &&
        deadline.getDate() === day
      );
    });

  } else {
    const year = calendarDate.getFullYear();
    const month = calendarDate.getMonth();

    homeworks = homeworks.filter(hw => {
      const deadline = parseDate(hw.deadline, hw.year);

      if (!deadline) return false;

      return (
        deadline.getFullYear() === year &&
        deadline.getMonth() === month
      );
    });
  }
}
  
homeworks.sort((a, b) => {
  const aDeadline = parseDate(a.deadline, a.year);
  const bDeadline = parseDate(b.deadline, b.year);

  // 兩個都沒有截止日期，維持原本順序
  if (!aDeadline && !bDeadline) return 0;

  // 沒有截止日期的放到最後
  if (!aDeadline) return 1;
  if (!bDeadline) return -1;

  // 有截止日期的，由近到遠排列
  return aDeadline - bDeadline;
});
  if (homeworks.length === 0) {
    list.innerHTML = `
      <div style="
        text-align:center;
        color:#999;
        padding:80px 20px;
      ">
        目前沒有作業
      </div>
    `;
    return;
  }

  const groups = {};

  for (const hw of homeworks) {
  const deadline = parseDate(hw.deadline, hw.year);

    const key = deadline
      ? `${deadline.getFullYear()}-${deadline.getMonth()}-${deadline.getDate()}`
      : 'unknown';

    if (!groups[key]) {
      groups[key] = {
        date: deadline,
        homeworks: []
      };
    }

    groups[key].homeworks.push(hw);
  }

  for (const group of Object.values(groups)) {
    const section = document.createElement('section');
    section.className = 'date-section';

    const dateTitle = document.createElement('div');
    dateTitle.className = 'date';

    dateTitle.textContent =
      group.date
        ? formatDate(group.date)
        : '未設定期限';

    section.appendChild(dateTitle);

    for (const hw of group.homeworks) {
      const card = document.createElement('a');

      card.className = 'homework';
      card.href = hw.url;
      card.target = '_blank';

      const [statusText, statusClass] =
        statusInfo(hw.status);

      const deadline = parseDate(hw.deadline);

      const time =
        deadline
          ? deadline.toLocaleTimeString('zh-TW', {
              hour: '2-digit',
              minute: '2-digit',
              hour12: false
            })
          : '—';

      const course = document.createElement('div');
      course.className = 'course';
      course.textContent = hw.course;

      const title = document.createElement('div');
      title.className = 'homework-title';
      title.textContent = hw.name;

      const info = document.createElement('div');
      info.className = 'info';

      const deadlineText = document.createElement('span');
      deadlineText.textContent = `截止 ${time}`;

      const status = document.createElement('span');
      status.className = `status ${statusClass}`;
      status.textContent = statusText;

      info.appendChild(deadlineText);
      info.appendChild(status);

      card.appendChild(course);
      card.appendChild(title);
      card.appendChild(info);

      section.appendChild(card);
    }

    list.appendChild(section);
  }
}

function renderMonthFilters() {
  const monthFilters = document.getElementById('monthFilters');

  monthFilters.innerHTML = '';

  const year = calendarDate.getFullYear();

  for (let month = 0; month < 12; month++) {
    const button = document.createElement('button');

    button.className = 'filter month-filter';
    button.textContent = `${month + 1}月`;

    if (
      calendarDate.getFullYear() === year &&
      calendarDate.getMonth() === month
    ) {
      button.classList.add('active');
    }

    button.addEventListener('click', () => {
      calendarDate = new Date(year, month, 1);
      selectedDate = null;

      renderMonthFilters();
      renderCalendar();
      render('all');
    });

    monthFilters.appendChild(button);
  }
}

function renderCalendar() {
  
  const calendarMonth = document.getElementById('calendarMonth');
  const calendarDays = document.getElementById('calendarDays');

  const year = calendarDate.getFullYear();
  const month = calendarDate.getMonth();

  calendarMonth.textContent = `${year} 年 ${month + 1} 月`;
  calendarDays.innerHTML = '';

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  for (let i = 0; i < firstDay; i++) {
    const empty = document.createElement('div');
    calendarDays.appendChild(empty);
  }

  const today = new Date();

// 找出這個月份哪些日期有作業
const homeworkDays = new Set();

allHomeworks.forEach(hw => {
  const deadline = parseDate(hw.deadline, hw.year);

  if (
    deadline &&
    deadline.getFullYear() === year &&
    deadline.getMonth() === month
  ) {
    homeworkDays.add(deadline.getDate());
  }
});

for (let day = 1; day <= daysInMonth; day++) {
    const button = document.createElement('button');

    button.className = 'calendar-day';
button.textContent = day;

// 這一天有作業
if (homeworkDays.has(day)) {
  button.classList.add('has-homework');
}

    if (
      year === today.getFullYear() &&
      month === today.getMonth() &&
      day === today.getDate()
    ) {
      button.classList.add('today');
    }

    if (
      selectedDate &&
      year === selectedDate.getFullYear() &&
      month === selectedDate.getMonth() &&
      day === selectedDate.getDate()
    ) {
      button.classList.add('selected');
    }

    button.addEventListener('click', () => {
      selectedDate = new Date(year, month, day);

      renderCalendar();
      render('all');
    });

    calendarDays.appendChild(button);
  }
}

document.getElementById('prevMonth').addEventListener('click', () => {
  calendarDate.setMonth(calendarDate.getMonth() - 1);
  selectedDate = null;

  renderMonthFilters();
  renderCalendar();
  render('all');
});

document.getElementById('nextMonth').addEventListener('click', () => {
  calendarDate.setMonth(calendarDate.getMonth() + 1);
  selectedDate = null;

  renderMonthFilters();
  renderCalendar();
  render('all');
});

document.getElementById('clearDateButton').addEventListener('click', () => {
  selectedDate = null;

  renderCalendar();
  render('all');
});
  
function updateButtons() {
  const counts = {
    todo: allHomeworks.filter(x => x.status === 'todo').length,
    late: allHomeworks.filter(x => x.status === 'late').length,
    future: allHomeworks.filter(x => x.status === 'future').length,
    done: allHomeworks.filter(x => x.status === 'done').length,
    all: allHomeworks.length
  };

  const buttons = document.querySelectorAll('.filter:not(.month-filter)');
  const data = [
    ['todo', `待完成 ${counts.todo}`],
    ['all', `全部 ${counts.all}`],
    ['late', `已逾期 ${counts.late}`],
    ['future', `未來 ${counts.future}`],
    ['done', `已完成 ${counts.done}`]
  ];

  buttons.forEach((button, index) => {
    const [filter, text] = data[index];

    button.dataset.filter = filter;
    button.textContent = text;

   button.onclick = () => {
  buttons.forEach(b => b.classList.remove('active'));
  button.classList.add('active');

  const dateFilterPanel = document.getElementById('dateFilterPanel');
const monthFilters = document.getElementById('monthFilters');

if (filter === 'all') {
  monthFilters.style.display = 'flex';
  dateFilterPanel.style.display = 'flex';

  selectedDate = null;
  calendarDate = new Date();

  renderMonthFilters();
  renderCalendar();
} else {
  monthFilters.style.display = 'none';
  dateFilterPanel.style.display = 'none';
}

render(filter);
};
  });
}

function loadHomeworks(homeworks) {
  allHomeworks = homeworks.map(hw => ({
    ...hw,
    status: getStatus(hw)
  }));

  updateButtons();
  render(currentFilter);
}


/// 讀取這台電腦之前同步的作業資料
const saved = localStorage.getItem('tnuaHomeworks');

if (saved) {
  try {
    loadHomeworks(JSON.parse(saved));
  } catch (error) {
    console.error('本機資料讀取失敗：', error);
  }
} else {
  // 第一次使用，還沒有任何作業資料
  allHomeworks = [];
  updateButtons();

  document.getElementById('homework-list').innerHTML = `
    <div style="
      text-align:center;
      color:#777;
      padding:80px 20px;
    ">
      尚未同步新藝學園
    </div>
  `;
}

document.getElementById('connectButton').addEventListener('click', () => {
  window.open(
    'https://eclass.tnua.edu.tw/dashboard',
    '_blank'
  );
});

window.addEventListener('message', (event) => {

  // 只接受新藝學園傳來的資料
  if (event.origin !== 'https://eclass.tnua.edu.tw') {
    return;
  }

  // 確認是我們的作業同步訊息
  if (event.data?.type !== 'TNUA_HOMEWORK_SYNC') {
    return;
  }

  const homeworks = event.data.homeworks;

  if (!Array.isArray(homeworks)) {
    return;
  }

  // 儲存在這位同學自己的瀏覽器
  localStorage.setItem(
    'tnuaHomeworks',
    JSON.stringify(homeworks)
  );

  const syncTime = new Date();

localStorage.setItem(
  'tnuaLastSync',
  syncTime.toISOString()
);

// 直接更新畫面
loadHomeworks(homeworks);

// 立即更新「上次同步」時間
const syncStatus = document.getElementById('syncStatus');
const lastSyncText = document.getElementById('lastSyncText');

syncStatus.style.display = 'flex';

lastSyncText.textContent =
  `上次同步：${syncTime.toLocaleString('zh-TW', {
    month: 'numeric',
    day: 'numeric',
    hour: '2-digit',
    minute: '2-digit'
  })}`;

  const welcomeCard = document.getElementById('welcomeCard');

if (welcomeCard) {
  welcomeCard.style.display = 'none';
}
});
</script>

<script>
document.getElementById('installButton').addEventListener('click', () => {
  const panel = document.getElementById('installPanel');

  if (panel.style.display === 'none') {
    panel.style.display = 'block';
  } else {
    panel.style.display = 'none';
  }
});

const lastSync = localStorage.getItem('tnuaLastSync');

if (lastSync) {
  document.getElementById('welcomeCard').style.display = 'none';

  const syncStatus = document.getElementById('syncStatus');
  const lastSyncText = document.getElementById('lastSyncText');

  syncStatus.style.display = 'flex';

  const date = new Date(lastSync);

  lastSyncText.textContent =
    `上次同步：${date.toLocaleString('zh-TW', {
      month: 'numeric',
      day: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    })}`;
}

document.getElementById('updateButton').addEventListener('click', () => {
  const eclassWindow = window.open(
    'https://eclass.tnua.edu.tw/dashboard',
    '_blank'
  );

  if (eclassWindow) {
    eclassWindow.focus();
  }
});
</script>
  
</body>
</html>
