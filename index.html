    @media (max-width: 600px) {
      .container {
        width: calc(100% - 28px);
        padding-top: 40px;
      }

        font-size: 29px;
      }

 .welcome {

.bookmarklet {

<body>

  <main class="container">

    <header>
      <h1>TNUA Homework List</h1>

      <div class="subtitle">
        <p>把新藝學園的作業，整理在一個地方。</p>
      </div>

     <div class="welcome" id="welcomeCard">
  <h2>開始使用</h2>
  <p>第一次使用只需要簡單設定一次。</p>

  <div class="setup-steps">
    <div class="setup-step">
      <strong>1　加入同步按鈕</strong>
      <span>將「同步新藝學園」加入 Safari 書籤。</span>
    </div>

    <div class="setup-step">
      <strong>2　連結新藝學園</strong>
      <span>登入你自己的新藝學園帳號。</span>
    </div>

    <div class="setup-step">
      <strong>3　同步作業</strong>
      <span>在新藝學園點擊「同步新藝學園」書籤。</span>
    </div>
  </div>

  <button id="installButton">
  安裝「同步新藝學園」
</button>

<div id="installPanel" style="display: none;">
  <p>
    將下方的「同步新藝學園」拖曳到 Safari 的喜好項目列。
  </p>

  <a
    href="javascript:(()=>{const s=document.createElement('script');s.src='https://hung970127.github.io/tnua-homewok--list/sync.js?'+Date.now();document.body.appendChild(s)})()"
    class="bookmarklet"
  >
    同步新藝學園
  </a>

  <p class="install-hint">
    只需要設定一次，之後就可以直接同步。
  </p>
</div>
       
       <button id="connectButton">
    連結新藝學園
  </button>

  <p class="privacy">
    不需要將新藝學園密碼提供給 TNUA Homework List。
  </p>
</div>

<div id="syncStatus" style="display: none;">
  <span id="lastSyncText">上次同步：--</span>

  <button id="updateButton">
    更新作業
  </button>
</div>
      
      <div class="filters">
        <button class="filter active">待完成</button>
        <button class="filter">全部</button>
        <button class="filter">已逾期</button>
        <button class="filter">未來</button>
        <button class="filter">已完成</button>
      </div>
    </header>


    <div id="homework-list"></div>


  <div id="homework-list"></div>

  </main>

<script>
const YEAR = 2026;
let allHomeworks = [];
let currentFilter = 'todo';

function parseDate(text) {
  if (!text) return null;

  const [md, time] = text.split(' ');
  if (!md || !time) return null;

  const [month, day] = md.split('-').map(Number);
  const [hour, minute] = time.split(':').map(Number);

  return new Date(YEAR, month - 1, day, hour, minute);
}

function getStatus(hw) {
  const now = new Date();
  const open = parseDate(hw.open);
  const deadline = parseDate(hw.deadline);

  if (hw.submitted) return 'done';
  if (open && now < open) return 'future';
  if (deadline && now > deadline) return 'late';

  return 'todo';
}

function formatDate(date) {
  const month = date.getMonth() + 1;
  const day = date.getDate();

  const today = new Date();
  const tomorrow = new Date();
  tomorrow.setDate(today.getDate() + 1);

  let label = '';

  if (
    date.getFullYear() === today.getFullYear() &&
    date.getMonth() === today.getMonth() &&
    date.getDate() === today.getDate()
  ) {
    label = ' · 今天';
  }

  else if (
    date.getFullYear() === tomorrow.getFullYear() &&
    date.getMonth() === tomorrow.getMonth() &&
    date.getDate() === tomorrow.getDate()
  ) {
    label = ' · 明天';
  }

  return `${month} 月 ${day} 日${label}`;
}

function statusInfo(status) {
  const map = {
    todo: ['待完成', 'todo'],
    late: ['已逾期', 'late'],
    done: ['已完成', 'done'],
    future: ['尚未開放', '']
  };

  return map[status];
}

function render(filter = 'todo') {
  currentFilter = filter;

  const list = document.getElementById('homework-list');
  list.innerHTML = '';

  let homeworks =
    filter === 'all'
      ? [...allHomeworks]
      : allHomeworks.filter(hw => hw.status === filter);

  homeworks.sort((a, b) => {
    return parseDate(a.deadline) - parseDate(b.deadline);
  });

  if (homeworks.length === 0) {
    list.innerHTML = `
      <div style="
        text-align:center;
        color:#999;
        padding:80px 20px;
      ">
        目前沒有作業
      </div>
    `;
    return;
  }

  const groups = {};

  for (const hw of homeworks) {
    const deadline = parseDate(hw.deadline);

    const key = deadline
      ? `${deadline.getFullYear()}-${deadline.getMonth()}-${deadline.getDate()}`
      : 'unknown';

    if (!groups[key]) {
      groups[key] = {
        date: deadline,
        homeworks: []
      };
    }

    groups[key].homeworks.push(hw);
  }

  for (const group of Object.values(groups)) {
    const section = document.createElement('section');
    section.className = 'date-section';

    const dateTitle = document.createElement('div');
    dateTitle.className = 'date';

    dateTitle.textContent =
      group.date
        ? formatDate(group.date)
        : '未設定期限';

    section.appendChild(dateTitle);

    for (const hw of group.homeworks) {
      const card = document.createElement('a');

      card.className = 'homework';
      card.href = hw.url;
      card.target = '_blank';

      const [statusText, statusClass] =
        statusInfo(hw.status);

      const deadline = parseDate(hw.deadline);

      const time =
        deadline
          ? deadline.toLocaleTimeString('zh-TW', {
              hour: '2-digit',
              minute: '2-digit',
              hour12: false
            })
          : '—';

      const course = document.createElement('div');
      course.className = 'course';
      course.textContent = hw.course;

      const title = document.createElement('div');
      title.className = 'homework-title';
      title.textContent = hw.name;

      const info = document.createElement('div');
      info.className = 'info';

      const deadlineText = document.createElement('span');
      deadlineText.textContent = `截止 ${time}`;

      const status = document.createElement('span');
      status.className = `status ${statusClass}`;
      status.textContent = statusText;

      info.appendChild(deadlineText);
      info.appendChild(status);

      card.appendChild(course);
      card.appendChild(title);
      card.appendChild(info);

      section.appendChild(card);
    }

    list.appendChild(section);
  }
}

function updateButtons() {
  const counts = {
    todo: allHomeworks.filter(x => x.status === 'todo').length,
    late: allHomeworks.filter(x => x.status === 'late').length,
    future: allHomeworks.filter(x => x.status === 'future').length,
    done: allHomeworks.filter(x => x.status === 'done').length,
    all: allHomeworks.length
  };

  const buttons = document.querySelectorAll('.filter');

  const data = [
    ['todo', `待完成 ${counts.todo}`],
    ['all', `全部 ${counts.all}`],
    ['late', `已逾期 ${counts.late}`],
    ['future', `未來 ${counts.future}`],
    ['done', `已完成 ${counts.done}`]
  ];

  buttons.forEach((button, index) => {
    const [filter, text] = data[index];

    button.dataset.filter = filter;
    button.textContent = text;

    button.addEventListener('click', () => {
      buttons.forEach(b => b.classList.remove('active'));
      button.classList.add('active');

      render(filter);
    });
  });
}

function loadHomeworks(homeworks) {
  allHomeworks = homeworks.map(hw => ({
    ...hw,
    status: getStatus(hw)
  }));

  updateButtons();
  render('todo');
}


// ① 檢查是不是剛從新藝學園同步回來
const params = new URLSearchParams(window.location.search);
const syncData = params.get('sync');

if (syncData) {
  try {
    const homeworks = JSON.parse(decodeURIComponent(syncData));

    // 存在這位使用者自己的瀏覽器
    localStorage.setItem(
      'tnuaHomeworks',
      JSON.stringify(homeworks)
    );

    // 記錄同步時間
    localStorage.setItem(
      'tnuaLastSync',
      new Date().toISOString()
    );

    // 把網址上的 ?sync=... 清掉
    window.history.replaceState(
      {},
      '',
      window.location.pathname
    );

    loadHomeworks(homeworks);

  } catch (error) {
    console.error('同步資料解析失敗：', error);
  }

} else {

  // ② 沒有新同步資料，就讀取這台電腦之前同步的資料
  const saved = localStorage.getItem('tnuaHomeworks');

  if (saved) {
    try {
      loadHomeworks(JSON.parse(saved));
    } catch (error) {
      console.error('本機資料讀取失敗：', error);
    }

  } else {

    // ③ 第一次使用，還沒有任何作業資料
    allHomeworks = [];
    updateButtons();

    document.getElementById('homework-list').innerHTML = `
      <div style="
        text-align:center;
        color:#777;
        padding:80px 20px;
      ">
        尚未同步新藝學園
      </div>
    `;
  }
}
document.getElementById('connectButton').addEventListener('click', () => {
  window.open(
    'https://eclass.tnua.edu.tw/dashboard',
    '_blank'
  );
});

window.addEventListener('message', (event) => {

  // 只接受新藝學園傳來的資料
  if (event.origin !== 'https://eclass.tnua.edu.tw') {
    return;
  }

  // 確認是我們的作業同步訊息
  if (event.data?.type !== 'TNUA_HOMEWORK_SYNC') {
    return;
  }

  const homeworks = event.data.homeworks;

  if (!Array.isArray(homeworks)) {
    return;
  }

  // 儲存在這位同學自己的瀏覽器
  localStorage.setItem(
    'tnuaHomeworks',
    JSON.stringify(homeworks)
  );

  localStorage.setItem(
    'tnuaLastSync',
    new Date().toISOString()
  );

  // 直接更新畫面
  loadHomeworks(homeworks);

  // 直接更新畫面
loadHomeworks(homeworks);
});
</script>

<script>
document.getElementById('installButton').addEventListener('click', () => {
  const panel = document.getElementById('installPanel');

  if (panel.style.display === 'none') {
    panel.style.display = 'block';
  } else {
    panel.style.display = 'none';
  }
});

const lastSync = localStorage.getItem('tnuaLastSync');

if (lastSync) {
  document.getElementById('welcomeCard').style.display = 'none';

  const syncStatus = document.getElementById('syncStatus');
  const lastSyncText = document.getElementById('lastSyncText');

  syncStatus.style.display = 'flex';

  const date = new Date(lastSync);

  lastSyncText.textContent =
    `上次同步：${date.toLocaleString('zh-TW', {
      month: 'numeric',
      day: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    })}`;
}

document.getElementById('updateButton').addEventListener('click', () => {
  const eclassWindow = window.open(
    'https://eclass.tnua.edu.tw/dashboard',
    '_blank'
  );

  if (eclassWindow) {
    eclassWindow.focus();
  }
});
</script>
  
</body>
