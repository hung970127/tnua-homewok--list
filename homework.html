<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>作業｜TNUA Homework List</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f7f5;
      color: #1f1f1f;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        "Noto Sans TC",
        sans-serif;
    }

    .container {
      width: min(820px, calc(100% - 40px));
      margin: 0 auto;
      padding: 70px 0 100px;
    }

    header {
      margin-bottom: 45px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      letter-spacing: -1px;
      font-weight: 700;
    }

    .subtitle {
      color: #8a8a8a;
      margin-top: 9px;
      font-size: 15px;
    }

   .navigation {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-bottom: 28px;
  flex-wrap: wrap;
}

    .navigation a {
      padding: 8px 14px;
      border-radius: 100px;
      border: 1px solid #e4e4e1;
      background: white;
      color: #333;
      text-decoration: none;
      font-size: 14px;
    }

    .navigation a:hover {
      background: #f1f1ef;
    }

    .navigation a.active {
      background: #1f1f1f;
      color: white;
      border-color: #1f1f1f;
    }

    .page-title {
      margin-top: 40px;
      font-size: 24px;
      font-weight: 600;
    }

    .page-description {
      margin-top: 8px;
      color: #888;
      font-size: 14px;
    }

    .empty {
      margin-top: 40px;
      padding: 80px 20px;
      text-align: center;
      color: #999;
      background: white;
      border: 1px solid #e8e8e5;
      border-radius: 14px;
    }

.date-section {
  margin-top: 34px;
}

.date {
  margin-bottom: 12px;
  font-size: 15px;
  font-weight: 600;
  color: #555;
}

.homework {
  display: block;
  margin-bottom: 12px;
  padding: 18px 20px;
  background: white;
  border: 1px solid #e8e8e5;
  border-radius: 14px;
  color: inherit;
  text-decoration: none;
  transition: background 0.15s ease;
}

.homework:hover {
  background: #fafaf8;
}

.course {
  margin-bottom: 7px;
  font-size: 13px;
  color: #999;
}

.homework-title {
  font-size: 16px;
  line-height: 1.5;
  font-weight: 600;
  color: #222;
}

.info {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 13px;
  font-size: 13px;
  color: #999;
}

.status {
  padding: 4px 9px;
  border-radius: 999px;
  font-size: 12px;
  background: #f1f1ef;
  color: #777;
}

.status.todo {
  color: #444;
}

.status.late {
  color: #555;
}

.status.done {
  color: #888;
}

.filters {
  display: flex;
  gap: 8px;
  margin-top: 24px;
  flex-wrap: wrap;
}

.filter {
  padding: 8px 14px;
  border: 1px solid #e4e4e1;
  border-radius: 999px;
  background: white;
  color: #555;
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
}

.filter:hover {
  background: #f1f1ef;
}

.filter.active {
  background: #1f1f1f;
  color: white;
  border-color: #1f1f1f;
}
    
    @media (max-width: 600px) {

      .container {
        width: calc(100% - 28px);
        padding-top: 40px;
      }

      h1 {
        font-size: 29px;
      }

      .header-top {
        align-items: flex-start;
      }

    }

  </style>

</head>


<body>

  <main class="container">

    <header>

      <div class="header-top">

        <h1>TNUA Homework List</h1>

      </div>

    </header>

     <div class="subtitle">
        <p>把新藝學園的作業，整理在這裡。</p>
      </div>


      <nav class="navigation">

        <a href="index.html">
          首頁
        </a>

        <a
          href="homework.html"
          class="active"
        >
          作業
        </a>

        <a href="calendar.html">
          行事曆
        </a>

        <a href="settings.html">
          設定
        </a>

      </nav>

    <section>

      <div class="page-title">
        作業
      </div>

      <div class="page-description">
        這裡會顯示你的新藝學園作業。
      </div>

<div class="filters">

  <button class="filter active" data-filter="all">
    全部
  </button>

  <button class="filter" data-filter="todo">
    待完成
  </button>

  <button class="filter" data-filter="late">
    已逾期
  </button>

  <button class="filter" data-filter="future">
    尚未開放
  </button>

  <button class="filter" data-filter="done">
    已完成
  </button>

</div>
      
     <div id="homework-list"></div>

    </section>

  </main>

<script>

  let allHomeworks = [];
let currentFilter = 'all';
  
  function parseDate(text, year = new Date().getFullYear()) {

    if (!text) return null;

    const [md, time] = text.split(' ');

    if (!md || !time) return null;

    const [month, day] = md.split('-').map(Number);
    const [hour, minute] = time.split(':').map(Number);

    return new Date(
      year,
      month - 1,
      day,
      hour,
      minute
    );
  }


  function getStatus(hw) {

    const now = new Date();

    const open = parseDate(hw.open, hw.year);
    const deadline = parseDate(hw.deadline, hw.year);

    if (hw.submitted) return 'done';

    if (open && now < open) return 'future';

    if (deadline && now > deadline) return 'late';

    return 'todo';
  }


  function formatDate(date) {

    return `${date.getMonth() + 1} 月 ${date.getDate()} 日`;

  }


  function statusInfo(status) {

    const map = {

      todo: ['待完成', 'todo'],

      late: ['已逾期', 'late'],

      done: ['已完成', 'done'],

      future: ['尚未開放', '']

    };

    return map[status];

  }


  function render() {

    const list =
      document.getElementById('homework-list');

    list.innerHTML = '';


   const homeworks =
  allHomeworks
    .map(hw => ({
      ...hw,
      status: getStatus(hw)
    }))
    .filter(hw => {
      if (currentFilter === 'all') {
        return true;
      }

      return hw.status === currentFilter;
    })
    .sort((a, b) => {

          const aDeadline =
            parseDate(a.deadline, a.year);

          const bDeadline =
            parseDate(b.deadline, b.year);

          if (!aDeadline && !bDeadline) return 0;

          if (!aDeadline) return 1;

          if (!bDeadline) return -1;

          return aDeadline - bDeadline;

        });


    if (homeworks.length === 0) {

      list.innerHTML = `
        <div class="empty">
          尚未同步新藝學園
        </div>
      `;

      return;

    }


    const groups = {};


    for (const hw of homeworks) {

      const deadline =
        parseDate(hw.deadline, hw.year);

      const key = deadline
        ? `${deadline.getFullYear()}-${deadline.getMonth()}-${deadline.getDate()}`
        : 'unknown';


      if (!groups[key]) {

        groups[key] = {

          date: deadline,

          homeworks: []

        };

      }


      groups[key].homeworks.push(hw);

    }


    for (const group of Object.values(groups)) {

      const section =
        document.createElement('section');

      section.className = 'date-section';


      const dateTitle =
        document.createElement('div');

      dateTitle.className = 'date';

      dateTitle.textContent =
        group.date
          ? formatDate(group.date)
          : '未設定期限';


      section.appendChild(dateTitle);


      for (const hw of group.homeworks) {

        const card =
          document.createElement('a');

        card.className = 'homework';

        card.href = hw.url;

        card.target = '_blank';


        const [statusText, statusClass] =
          statusInfo(hw.status);


        const deadline =
          parseDate(hw.deadline, hw.year);


        const time =
          deadline
            ? deadline.toLocaleTimeString(
                'zh-TW',
                {
                  hour: '2-digit',
                  minute: '2-digit',
                  hour12: false
                }
              )
            : '—';


        const course =
          document.createElement('div');

        course.className = 'course';

        course.textContent = hw.course;


        const title =
          document.createElement('div');

        title.className = 'homework-title';

        title.textContent = hw.name;


        const info =
          document.createElement('div');

        info.className = 'info';


        const deadlineText =
          document.createElement('span');

        deadlineText.textContent =
          `截止 ${time}`;


        const status =
          document.createElement('span');

        status.className =
          `status ${statusClass}`;

        status.textContent =
          statusText;


        info.appendChild(deadlineText);

        info.appendChild(status);


        card.appendChild(course);

        card.appendChild(title);

        card.appendChild(info);


        section.appendChild(card);

      }


      list.appendChild(section);

    }

  }


  const saved =
    localStorage.getItem('tnuaHomeworks');


  if (saved) {

    try {

      allHomeworks =
        JSON.parse(saved);

      render();

    } catch (error) {

      console.error(
        '作業資料讀取失敗：',
        error
      );

    }

  } else {

    render();

  }

document.querySelectorAll('.filter').forEach(button => {

  button.addEventListener('click', () => {

    currentFilter =
      button.dataset.filter;

    document
      .querySelectorAll('.filter')
      .forEach(item => {
        item.classList.remove('active');
      });

    button.classList.add('active');

    render();

  });

});
  
</script>

</body>

</html>
