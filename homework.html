<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>作業｜TNUA Hub</title>

  <style>

html {
  width: 100vw;
}
    
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f7f5;
      color: #1f1f1f;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        "Noto Sans TC",
        sans-serif;
    }

.container {
  width: 820px;
  max-width: calc(100% - 40px);
  margin: 0 auto;
  padding: 70px 0 100px;
}

    header {
  margin-bottom: 45px;
  position: relative;
}
    
    .header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}
    h1 {
      margin: 0;
      font-size: 34px;
      letter-spacing: -1px;
      font-weight: 700;
    }

    .subtitle {
      color: #8a8a8a;
      margin-top: 9px;
      font-size: 15px;
    }

.navigation {
  position: absolute;
  top: 0;
  right: 0;

  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

    .navigation a {
      padding: 8px 14px;
      border-radius: 100px;
      border: 1px solid #e4e4e1;
      background: white;
      color: #333;
      text-decoration: none;
      font-size: 14px;
    }

    .navigation a:hover {
      background: #f1f1ef;
    }

.navigation a.active {
  background: #1f1f1f;
  color: white;
  border-color: #1f1f1f;
}
    
  .navigation a[href="settings.html"] {
  background: #d97706;
  color: white;
  border-color: #d97706;
  font-weight: 600;
}

.navigation a[href="settings.html"]:hover {
  background: #b45309;
  border-color: #b45309;
}

.navigation a[href="settings.html"].active {
  background: #b45309;
  color: white;
  border-color: #b45309;
}

    .page-title {
      margin-top: 40px;
      font-size: 24px;
      font-weight: 600;
    }

    .page-description {
      margin-top: 8px;
      color: #888;
      font-size: 14px;
    }

    .empty {
      margin-top: 40px;
      padding: 80px 20px;
      text-align: center;
      color: #999;
      background: white;
      border: 1px solid #e8e8e5;
      border-radius: 14px;
    }

.date-section {
  margin-top: 34px;
}

.date {
  margin-bottom: 12px;
  font-size: 15px;
  font-weight: 600;
  color: #555;
}

.homework {
  position: relative;
  display: block;
  margin-bottom: 12px;
  padding: 18px 20px;
  background: white;
  border: 1px solid #e8e8e5;
  border-radius: 14px;
  color: inherit;
  text-decoration: none;
  transition: background 0.15s ease;
}

.homework:hover {
  background: #fafaf8;
}

.homework-link {
  display: block;
  color: inherit;
  text-decoration: none;
  padding-right: 140px;
}

.abandon-button {
  position: absolute;
  right: 20px;
  top: 50%;
  transform: translateY(-50%);
  margin-top: 0;
  padding: 7px 12px;
  border: 1px solid #c0392b;
  border-radius: 999px;
  background: white;
  color: #c0392b;
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
}

.abandon-button:hover {
  background: #fff1f0;
  color: #c0392b;
  border-color: #c0392b;
}
    
.course {
  margin-bottom: 7px;
  font-size: 13px;
  color: #999;
}

.homework-title {
  font-size: 16px;
  line-height: 1.5;
  font-weight: 600;
  color: #222;
}

.info {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 10px;
  margin-top: 13px;
  font-size: 13px;
  color: #999;
  flex-wrap: wrap;
}

.status {
  padding: 4px 9px;
  border-radius: 999px;
  font-size: 12px;
  background: #f1f1ef;
  color: #777;
}

.status.todo {
  color: #444;
}

.status.late {
  color: #555;
}

.status.done {
  color: #888;
}

.filters {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
  margin-top: 24px;
}

.filter {
  padding: 8px 14px;
  border: 1px solid #e4e4e1;
  border-radius: 999px;
  background: white;
  color: #555;
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
    white-space: nowrap;
}

.filter:hover {
  background: #f1f1ef;
}

.filter.active {
  background: #1f1f1f;
  color: white;
  border-color: #1f1f1f;
}

    .filter[data-filter="abandoned"] {
  color: #c0392b;
  border-color: #e8b8b3;
}

.filter[data-filter="abandoned"]:hover {
  background: #fff1f0;
}

.filter[data-filter="abandoned"].active {
  background: #c0392b;
  color: white;
  border-color: #c0392b;
}

.month-filters {
  display: grid;
  grid-template-columns: repeat(12, 58px);
  gap: 8px;
  justify-content: space-between;
  margin-top: 28px;
}

.month-filter {
  width: 58px;
  height: 32px;
  padding: 0;
  border: 1px solid #d8d8d3;
  border-radius: 999px;
  background: #f1f1ef;
  color: #555;
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  text-align: center;
}
    
.month-filter:hover {
  background: #d8d8d3;
  color: #444;
}

.month-filter.active {
  background: #1f1f1f;
  color: white;
  border-color: #1f1f1f;
  font-weight: 600;
}
    
    @media (max-width: 600px) {

      .container {
        width: calc(100% - 28px);
        padding-top: 40px;
      }

      h1 {
        font-size: 29px;
      }

      .header-top {
        align-items: flex-start;
      }

    }

  </style>

</head>


<body>

  <main class="container">

    <header>

  <nav class="navigation">

    <a href="index.html">
      首頁
    </a>

    <a
      href="homework.html"
      class="active"
    >
      作業
    </a>

    <a href="calendar.html">
      行事曆
    </a>

    <a href="settings.html">
      使用教學
    </a>

  </nav>

  <div class="header-top">

    <h1>TNUA Hub</h1>

  </div>

  <div class="subtitle">

  </div>

</header>
     
    <section>

      <div class="page-title">
        作業
      </div>

      <div class="page-description">
       
      </div>

<div class="filters">

  <button class="filter active" data-filter="all">
    全部
  </button>

  <button class="filter" data-filter="todo">
    待完成
  </button>

  <button class="filter" data-filter="late">
    已逾期
  </button>

  <button class="filter" data-filter="future">
    尚未開放
  </button>

  <button class="filter" data-filter="done">
    已完成
  </button>

<button class="filter" data-filter="abandoned">
  老子不做了
</button>
  
</div>

      <div class="month-filters">

  <button class="month-filter" data-month="9">
    9 月
  </button>

  <button class="month-filter" data-month="10">
    10 月
  </button>

  <button class="month-filter" data-month="11">
    11 月
  </button>

  <button class="month-filter" data-month="12">
    12 月
  </button>

  <button class="month-filter" data-month="1">
    1 月
  </button>

  <button class="month-filter" data-month="2">
    2 月
  </button>

  <button class="month-filter" data-month="3">
    3 月
  </button>

  <button class="month-filter" data-month="4">
    4 月
  </button>

  <button class="month-filter active" data-month="5">
    5 月
  </button>

  <button class="month-filter" data-month="6">
    6 月
  </button>

  <button class="month-filter" data-month="7">
    7 月
  </button>

  <button class="month-filter" data-month="8">
    8 月
  </button>

</div>

<div id="homework-list"></div>
      
    </section>

  </main>

<script>

let allHomeworks = [];
let currentFilter = 'all';
let currentMonth = 9;
let hasAutoScrolled = false;
let abandonedHomeworks =
  JSON.parse(
    localStorage.getItem('tnuaAbandonedHomeworks') || '[]'
  );
  
  function parseDate(text, year = new Date().getFullYear()) {

    if (!text) return null;

    const [md, time] = text.split(' ');

    if (!md || !time) return null;

    const [month, day] = md.split('-').map(Number);
    const [hour, minute] = time.split(':').map(Number);

    return new Date(
      year,
      month - 1,
      day,
      hour,
      minute
    );
  }


  function getStatus(hw) {

    const now = new Date();

    const open = parseDate(hw.open, hw.year);
    const deadline = parseDate(hw.deadline, hw.year);

if (
  abandonedHomeworks.includes(String(hw.id))
) {
  return 'abandoned';
}
    
    if (hw.submitted) return 'done';

    if (open && now < open) return 'future';

    if (deadline && now > deadline) return 'late';

    return 'todo';
  }


  function formatDate(date) {

    return `${date.getMonth() + 1} 月 ${date.getDate()} 日`;

  }


  function statusInfo(status) {

    const map = {

      todo: ['待完成', 'todo'],

      late: ['已逾期', 'late'],

      done: ['已完成', 'done'],

abandoned: ['老子不做了', 'abandoned'],
      
      future: ['尚未開放', '']

    };

    return map[status];

  }


  function render() {

    const list =
      document.getElementById('homework-list');

    list.innerHTML = '';

  // 第一次進入作業頁時，
  // 自動選擇今天或未來最近有作業的月份
  if (!hasAutoScrolled && allHomeworks.length > 0) {

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    let nearestDate = null;

    for (const hw of allHomeworks) {

      const deadline =
        parseDate(hw.deadline, hw.year);

      if (!deadline) continue;

      const date = new Date(deadline);
      date.setHours(0, 0, 0, 0);

      if (
        date >= today &&
        (
          nearestDate === null ||
          date < nearestDate
        )
      ) {
        nearestDate = date;
      }

    }

    if (nearestDate) {

      currentMonth =
        nearestDate.getMonth() + 1;

      document
        .querySelectorAll('.month-filter')
        .forEach(button => {

          button.classList.toggle(
            'active',
            Number(button.dataset.month) === currentMonth
          );

        });

    }

  }
    

  const homeworks =
  allHomeworks
    .map(hw => ({
      ...hw,
      status: getStatus(hw)
    }))
    .filter(hw => {

      const deadline =
        parseDate(hw.deadline, hw.year);

      // 月份篩選
      if (
        !deadline ||
        deadline.getMonth() + 1 !== currentMonth
      ) {
        return false;
      }

      // 狀態篩選
      if (currentFilter === 'all') {
        return true;
      }

      return hw.status === currentFilter;

    })
    
    .sort((a, b) => {

          const aDeadline =
            parseDate(a.deadline, a.year);

          const bDeadline =
            parseDate(b.deadline, b.year);

          if (!aDeadline && !bDeadline) return 0;

          if (!aDeadline) return 1;

          if (!bDeadline) return -1;

          return aDeadline - bDeadline;

        });


    if (homeworks.length === 0) {

      list.innerHTML = `
        <div class="empty">
          無作業
        </div>
      `;

      return;

    }


    const groups = {};


    for (const hw of homeworks) {

      const deadline =
        parseDate(hw.deadline, hw.year);

      const key = deadline
        ? `${deadline.getFullYear()}-${deadline.getMonth()}-${deadline.getDate()}`
        : 'unknown';


      if (!groups[key]) {

        groups[key] = {

          date: deadline,

          homeworks: []

        };

      }


      groups[key].homeworks.push(hw);

    }


 let targetSection = null;
let targetDate = null;

const today = new Date();
today.setHours(0, 0, 0, 0);

for (const group of Object.values(groups)) {

  const section =
    document.createElement('section');
      section.className = 'date-section';

  if (group.date) {

  const groupDate = new Date(group.date);
  groupDate.setHours(0, 0, 0, 0);

  if (groupDate >= today) {

    if (
      targetDate === null ||
      groupDate < targetDate
    ) {
      targetDate = groupDate;
      targetSection = section;
    }

  }

}

      const dateTitle =
        document.createElement('div');

      dateTitle.className = 'date';

      dateTitle.textContent =
        group.date
          ? formatDate(group.date)
          : '未設定期限';


      section.appendChild(dateTitle);


      for (const hw of group.homeworks) {

       const card =
  document.createElement('div');

card.className = 'homework';

        const [statusText, statusClass] =
          statusInfo(hw.status);


        const deadline =
          parseDate(hw.deadline, hw.year);


        const time =
          deadline
            ? deadline.toLocaleTimeString(
                'zh-TW',
                {
                  hour: '2-digit',
                  minute: '2-digit',
                  hour12: false
                }
              )
            : '—';


        const course =
          document.createElement('div');

        course.className = 'course';

        course.textContent = hw.course;


        const title =
          document.createElement('div');

        title.className = 'homework-title';

        title.textContent = hw.name;


        const info =
          document.createElement('div');

        info.className = 'info';


        const deadlineText =
          document.createElement('span');

        deadlineText.textContent =
          `截止 ${time}`;


        const status =
          document.createElement('span');

        status.className =
          `status ${statusClass}`;

        status.textContent =
          statusText;


        info.appendChild(deadlineText);

        info.appendChild(status);

        const homeworkLink =
  document.createElement('a');

homeworkLink.href = hw.url;
homeworkLink.target = '_blank';
homeworkLink.className = 'homework-link';

homeworkLink.appendChild(course);
homeworkLink.appendChild(title);
homeworkLink.appendChild(info);

const abandonButton =
  document.createElement('button');

abandonButton.className = 'abandon-button';

if (hw.status === 'abandoned') {
  abandonButton.textContent = '恢復';
} else {
  abandonButton.textContent = '老子不做了';
}

abandonButton.addEventListener('click', (event) => {

  event.stopPropagation();

  if (abandonedHomeworks.includes(String(hw.id))) {

    abandonedHomeworks =
      abandonedHomeworks.filter(
        id => id !== String(hw.id)
      );

  } else {

    abandonedHomeworks.push(
      String(hw.id)
    );

  }

  localStorage.setItem(
    'tnuaAbandonedHomeworks',
    JSON.stringify(abandonedHomeworks)
  );

  render();

});

card.innerHTML = '';

card.appendChild(homeworkLink);

if (
  hw.status !== 'late' &&
  hw.status !== 'done'
) {
  card.appendChild(abandonButton);
}

section.appendChild(card);
      }


      list.appendChild(section);

    }

if (!hasAutoScrolled && targetSection) {

  setTimeout(() => {

    window.scrollTo({
      top: targetSection.offsetTop - 30,
      behavior: 'smooth'
    });

    hasAutoScrolled = true;

  }, 100);

}
    
  }


  const saved =
    localStorage.getItem('tnuaHomeworks');


  if (saved) {

    try {

      allHomeworks =
        JSON.parse(saved);

      render();

    } catch (error) {

      console.error(
        '作業資料讀取失敗：',
        error
      );

    }

  } else {

    render();

  }

document.querySelectorAll('.filter').forEach(button => {

  button.addEventListener('click', () => {

    currentFilter =
      button.dataset.filter;

    document
      .querySelectorAll('.filter')
      .forEach(item => {
        item.classList.remove('active');
      });

    button.classList.add('active');

    render();

  });

});

document.querySelectorAll('.month-filter').forEach(button => {

  button.addEventListener('click', () => {

    currentMonth =
      Number(button.dataset.month);

    document
      .querySelectorAll('.month-filter')
      .forEach(item => {
        item.classList.remove('active');
      });

    button.classList.add('active');

    render();

  });

});
  
</script>

</body>

</html>
